<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : la page occupe tout l'écran, encoche comprise (marges via env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Couleur de la barre du navigateur : celle de l'en-tête (surface), ajustée au thème. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Thème posé avant le rendu (pas de flash) : choix mémorisé, sinon celui du système.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("lod-theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#241714" : "#ffffff";
      })();
    </script>
    <title>Les Outils du Docteur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Seules les graisses utilisées (400, 500, 600) : moins de données à télécharger sur mobile. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
